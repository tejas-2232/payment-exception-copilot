name: Offline checks
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - name: Fail if case files and fraud labels get out of step
        run: python -m pytest -q tests/test_case_fraud_alignment.py
      - run: python -m pytest -q
